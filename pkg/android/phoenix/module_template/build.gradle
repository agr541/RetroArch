apply plugin: 'com.android.dynamic-feature'

android {
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
android {
  namespace "com.agr541.retroarch.modules.%CORE_NAME%"

    android {
        packagingOptions {
            jniLibs {
                useLegacyPackaging true
            }
        }
    }
  compileSdkVersion 37
  buildToolsVersion "37.0.0"

  defaultConfig {
    minSdkVersion 26
    targetSdkVersion 37
  }

  ndkVersion "29.0.14206865"

  flavorDimensions "variant"

  productFlavors {
    normal {
      dimension "variant"
    }
    aarch64 {
      dimension "variant"
      ndk {
        abiFilters 'arm64-v8a', 'x86_64'
      }
    }
    ra32 {
      dimension "variant"
      ndk {
        abiFilters 'armeabi-v7a', 'x86'
      }
    }
    playStoreNormal {
      minSdkVersion 26
      targetSdkVersion 37
      dimension "variant"
    }
    playStorePlus {
      minSdkVersion 26
      targetSdkVersion 37
      dimension "variant"
    }
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      jniLibs.srcDirs = ['libs']
    }
  }
}

dependencies {
  implementation rootProject
}
